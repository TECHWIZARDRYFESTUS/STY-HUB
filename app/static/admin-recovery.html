<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administrator recovery | Stationary Hub</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f5f9; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; }
    main { width: min(100%, 28rem); box-sizing: border-box; padding: 2rem; background: white; border: 1px solid #e1e6ef; border-radius: 1rem; box-shadow: 0 1rem 3rem #14213d12; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #596579; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .75rem; border: 1px solid #cbd3df; border-radius: .5rem; font: inherit; }
    button { width: 100%; margin-top: 1.5rem; padding: .8rem; color: white; background: #2458d3; border: 0; border-radius: .5rem; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 1.5rem; margin-bottom: 0; }
    #message[data-error="true"] { color: #a32626; }
    #message[data-error="false"] { color: #176b3a; }
  </style>
</head>
<body>
  <main>
    <h1>Administrator password recovery</h1>
    <p>Use the one-time recovery token configured for this service. The new password will be securely hashed.</p>
    <form id="recovery-form">
      <label for="token">One-time recovery token</label>
      <input id="token" name="token" type="password" minlength="32" maxlength="256" autocomplete="off" required>

      <label for="current-email">Current administrator email</label>
      <input id="current-email" name="current-email" type="email" maxlength="160" autocomplete="username" required>

      <label for="new-email">New administrator email (optional)</label>
      <input id="new-email" name="new-email" type="email" maxlength="160" autocomplete="email">

      <label for="password">New password (12-72 UTF-8 bytes)</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>

      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" name="confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>

      <button id="submit" type="submit">Reset administrator credentials</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("recovery-form");
    const message = document.getElementById("message");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = document.getElementById("token").value;
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmation").value;
      message.dataset.error = "true";

      if (new TextEncoder().encode(password).length > 72) {
        message.textContent = "Password must be no more than 72 UTF-8 bytes.";
        return;
      }
      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
      }

      submit.disabled = true;
      message.textContent = "Updating credentials…";
      try {
        const response = await fetch("/api/recovery/admin-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            recovery_token: token,
            current_email: document.getElementById("current-email").value,
            new_email: document.getElementById("new-email").value || null,
            new_password: password
          })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "Unable to reset credentials.");
        }
        message.dataset.error = "false";
        message.textContent = `Credentials updated for ${result.email}. Remove ADMIN_RESET_TOKEN from the Render Environment settings, then sign in with the new credentials.`;
        document.getElementById("token").value = "";
        document.getElementById("password").value = "";
        document.getElementById("confirmation").value = "";
      } catch (error) {
        message.textContent = error.message || "Unable to reset credentials. Please try again.";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
